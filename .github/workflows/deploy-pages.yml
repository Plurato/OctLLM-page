name: Deploy project page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate the site
        run: |
          python3 scripts/check_site.py
          for file in script.js release-config.js model-data.js gallery-data.js; do
            node --check "$file"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare the site
        run: |
          mkdir -p "$RUNNER_TEMP/octllm-site"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/scripts/' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='.DS_Store' \
            ./ "$RUNNER_TEMP/octllm-site/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/octllm-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
